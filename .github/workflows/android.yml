name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 testDebugUnitTest

      - name: Restore signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > masarify-release.jks
          cat > keystore.properties <<EOF
          storeFile=masarify-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF

      - name: Assemble debug and release
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: masarify-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish signed release APK to Releases
        if: ${{ github.ref == 'refs/heads/main' && secrets.KEYSTORE_BASE64 != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "Masarify-v$VERSION-release.apk"
          sha256sum "Masarify-v$VERSION-release.apk" > "Masarify-v$VERSION-release.apk.sha256"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "Masarify-v$VERSION-release.apk" "Masarify-v$VERSION-release.apk.sha256" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "Masarify-v$VERSION-release.apk" "Masarify-v$VERSION-release.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --title "مصاريفي $TAG" \
              --notes "تم بناء هذا الإصدار تلقائيًا من GitHub Actions على الكوميت ${GITHUB_SHA::7}."
          fi
