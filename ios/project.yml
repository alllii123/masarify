# ملف بديل لتوليد مشروع Xcode عبر xcodegen.
# يُستخدم في CI إذا تعذّر قراءة project.pbxproj، ويُستخدم أيضًا
# على لينكس/ويندوز لتوليد مشروع نظيف بلا أخطاء يدوية.
name: Mahfazati

options:
  bundleIdPrefix: com.mahfazati
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ar

settings:
  base:
    MARKETING_VERSION: "0.4.8"
    CURRENT_PROJECT_VERSION: "10"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO

targets:
  Mahfazati:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Mahfazati
        excludes:
          - "Info.plist"
    # Info.plist ملتزم في المستودع ويحتوي المتغيرات $(PRODUCT_BUNDLE_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mahfazati.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Mahfazati/Info.plist
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Mahfazati:
    build:
      targets:
        Mahfazati: all
    run:
      config: Debug
    archive:
      config: Release
